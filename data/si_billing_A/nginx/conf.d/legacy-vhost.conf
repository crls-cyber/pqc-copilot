# Ancien vhost interne (service hérité, clients anciens).
server {
    listen 8443 ssl;
    server_name internal-legacy.billing.example;

    ssl_certificate     /etc/nginx/pki/old-server.crt;
    ssl_certificate_key /etc/nginx/pki/old-server.key;

    ssl_protocols       TLSv1.2;
    ssl_ciphers         AES256-GCM-SHA384;

    include             /etc/nginx/snippets/legacy-ciphers.conf;

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}
