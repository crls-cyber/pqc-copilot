# Reverse proxy TLS devant l'API de facturation.
server {
    listen 443 ssl;
    http2 on;
    server_name api.billing.example;

    ssl_certificate     /etc/nginx/pki/server-tls.crt;
    ssl_certificate_key /etc/nginx/pki/server-tls.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    ssl_ecdh_curve      X25519;
    ssl_dhparam         /etc/nginx/pki/dhparam.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
