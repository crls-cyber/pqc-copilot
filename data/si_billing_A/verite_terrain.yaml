# Vérité terrain — SI fictif « Billing » (variante A)
# Projet individuel n° 7 — Quantum-Ready — pqc-copilot
#
# Chaque entrée décrit un actif cryptographique PLANTÉ volontairement dans le SI.
# Ce fichier est la RÉFÉRENCE contre laquelle l'inventaire produit par les agents
# est évalué (rappel / précision), global et par type d'actif.
#
# Champs :
#   type        : algorithm | certificate | protocol | related-crypto-material
#   visibilite  : visible | cache
#   masquage    : dependance | code-mort | config-indirecte | cle-en-dur | backup | env-exemple
#   statut      : robuste | vulnerable-q | deprecie-proche | a-bannir
#
# Statut -> vague de migration : a-bannir=V1 (urgent), deprecie-proche=V2, vulnerable-q=V3 (PQC).

meta:
  si: billing
  variante: A
  version: 1
  total_actifs: 54
  total_caches: 14
  scenario: "SI de facturation d'une Business Unit d'un grand groupe"

